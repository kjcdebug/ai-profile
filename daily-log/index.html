<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>IMC Daily Log</title>
<script>
  // The Daily Log page moved to kjcdebug.github.io/daily-log/ on 2026-10-14.
  // Forward older links, keeping the #d1. code (or a code that ended up in the path).
  (function () {
    var m = decodeURIComponent(location.pathname + location.search + location.hash).match(/d1\.[A-Za-z0-9_-]+/);
    location.replace("https://kjcdebug.github.io/daily-log/" + (m ? "#" + m[0] : ""));
  })();
</script>
</head>
<body></body>
</html>
